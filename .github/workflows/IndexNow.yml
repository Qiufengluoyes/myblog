name: IndexNow Action
on:
  schedule:
    # Set the schedule time
    - cron: '*/5 * * * *'

jobs:
  check-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: indexnow-action
        uses: bojieyang/indexnow-action@v2.1.0
        with:
          sitemap-location: 'https://blog.feng1026.top/sitemap-0.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
